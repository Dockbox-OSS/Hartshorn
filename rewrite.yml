---
type: specs.openrewrite.org/v1beta/recipe
name: org.dockbox.hartshorn.HartshornMain
displayName: "Hartshorn main configuration"
description: "Configuration for Hartshorn standard conventions."
recipeList:
  # Whitespace and formatting
  - org.openrewrite.java.format.EmptyNewlineAtEndOfFile
  - org.openrewrite.java.format.RemoveTrailingWhitespace
  - org.openrewrite.java.format.SingleLineComments
  - org.openrewrite.staticanalysis.CodeCleanup
  # Annotations
  - org.openrewrite.staticanalysis.MissingOverrideAnnotation
  - org.openrewrite.java.jspecify.JSpecifyBestPractices
  # Code improvements
  - org.openrewrite.java.migrate.util.SequencedCollection
  - org.openrewrite.java.migrate.util.JavaUtilAPIs
  - org.openrewrite.java.migrate.util.IteratorNext

---
type: specs.openrewrite.org/v1beta/recipe
name: org.dockbox.hartshorn.HartshornTests
displayName: "Hartshorn test configuration"
description: "Configuration for Hartshorn testing conventions. Codestyle is complemented by Checkstyle rules."
recipeList:
  - org.openrewrite.java.testing.junit.JupiterBestPractices
  - org.openrewrite.java.testing.assertj.Assertj

---
type: specs.openrewrite.org/v1beta/style
name: org.dockbox.hartshorn.HartshornStyle
displayName: "Hartshorn code style"
description: "Code style conventions for Hartshorn projects."
styleConfigs:
  - org.openrewrite.java.style.ImportLayoutStyle:
      classCountToUseStarImport: 9999