<!-- Basic HTML page to show a styled 'Hello world' -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .hello-container {
            background-color: #fff;
            padding: 20px 40px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 0 8px #ddd;
        }
        h1 {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="hello-container">
        <h1>Hello, World!</h1>
        <p>This is a basic HTML asset served statically through Hartshorn.</p>
    </div>
</body>
</html>
