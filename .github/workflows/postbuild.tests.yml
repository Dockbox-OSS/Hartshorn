name: Tests

on: workflow_call

jobs:
  coverage:
    name: Code coverage (JDK 21, Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up source JDK
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
      - name: Run tests
        id: test
        run: "mvn clean verify 
        -P ci 
        -Djacoco.haltOnFailure=true 
        -Djacoco.skip=false 
        -Dcoverage.skip=false"
  testSourceCompat:
    needs: [coverage]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    name: Unit tests (Compatibility, JDK 21, ${{ matrix.os }})
    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v3
      - name: Set up source JDK
        uses: actions/setup-java@v3
        with:
          java-version: 21
          distribution: temurin
      - name: "Unit testing (OS: ${{ matrix.os }}, source JDK)"
        # Note that coverage should still be enabled here, as specific instructions may differ per platform
        run: "mvn clean verify 
        -P ci 
        -Djacoco.haltOnFailure=true 
        -Djacoco.skip=false 
        -Dcoverage.skip=false"
        shell: bash
