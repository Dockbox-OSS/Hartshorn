name: Check code style

on: workflow_call

jobs:
  depCheck:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: temurin
      - name: Check code style
        run: mvn clean verify -DskipTests -P ci -Dcheckstyle.skip=false -Derrorprone.skip=false
